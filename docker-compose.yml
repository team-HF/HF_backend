version: '3.8'
services:
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # nginx 설정 파일
    depends_on:
      - spring1
      - spring2
    networks:
      - app-network

  spring1:
    image: hf/backend:${BUILD_ID}
    container_name: spring1-container
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local-dev,secret,constants,priv
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_ALARM_QUEUE_URL=${AWS_SQS_ALARM_QUEUE_URL}
      - AWS_SQS_DB_QUEUE_URL=${AWS_SQS_DB_QUEUE_URL}
    networks:
      - app-network

  spring2:
    image: hf/backend:${BUILD_ID}
    container_name: spring2-container
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local-dev,secret,constants,priv
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_ALARM_QUEUE_URL=${AWS_SQS_ALARM_QUEUE_URL}
      - AWS_SQS_DB_QUEUE_URL=${AWS_SQS_DB_QUEUE_URL}
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge