services:
  nginx1:
    profiles:
      - blue
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      # 커스텀 설정 파일을 nginx 컨테이너 내부의 설정 파일로 마운트
      - ./nginx/nginx1/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring1
    networks:
      - app-network
  
  nginx2:
    profiles:
      - green
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      # 커스텀 설정 파일을 nginx 컨테이너 내부의 설정 파일로 마운트
      - ./nginx/nginx2/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring2
    networks:
      - app-network
  
  nginx1-noauth:
    profiles:
      - blue-noauth
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      # 커스텀 설정 파일을 nginx 컨테이너 내부의 설정 파일로 마운트
      - ./nginx/nginx1-noauth/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring1
    networks:
      - app-network

  spring1:
    profiles:
      - blue
    image: hf/backend:latest
    container_name: spring1-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local-dev,secret,constants,priv
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_ALARM_QUEUE_URL=${AWS_SQS_ALARM_QUEUE_URL}
      - AWS_SQS_DB_QUEUE_URL=${AWS_SQS_DB_QUEUE_URL}
      - REDIS_HOST=redis://redis-container:6379
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy

  spring1-noauth:
    profiles:
      - blue-noauth
    image: hf/backend:latest
    container_name: spring1-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local-dev,secret,constants,priv,no-auth
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_ALARM_QUEUE_URL=${AWS_SQS_ALARM_QUEUE_URL}
      - AWS_SQS_DB_QUEUE_URL=${AWS_SQS_DB_QUEUE_URL}
      - REDIS_HOST=redis://redis-container:6379
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy

  spring2:
    profiles:
      - green
    image: hf/backend:latest
    container_name: spring2-container
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local-dev,secret,constants,priv
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_ALARM_QUEUE_URL=${AWS_SQS_ALARM_QUEUE_URL}
      - AWS_SQS_DB_QUEUE_URL=${AWS_SQS_DB_QUEUE_URL}
      - REDIS_HOST=redis://redis-container:6379
    networks:
      - app-network
    depends_on:
      - redis
      - mysql

  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - app-network

  mysql:
    image: mysql:8.0.40
    container_name: mysql-container
    ports:
      - "3306:3306"
      - "33060:33060"
    environment:
      - MYSQL_ROOT_PASSWORD=1111
      - MYSQL_DATABASE=hf
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=1111"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge