services:
  nginx-blue:
    profiles:
      - blue
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      # 커스텀 설정 파일을 nginx 컨테이너 내부의 설정 파일로 마운트
      - ./nginx/nginx-blue/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring-blue
    networks:
      - app-network
  
  nginx-green:
    profiles:
      - green
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "81:80"
    volumes:
      # 커스텀 설정 파일을 nginx 컨테이너 내부의 설정 파일로 마운트
      - ./nginx/nginx-green/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring-green
    networks:
      - app-network

  nginx-test:
    profiles:
      - test
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      # 커스텀 설정 파일을 nginx 컨테이너 내부의 설정 파일로 마운트
      - ./nginx/nginx-test/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring-green
    networks:
      - app-network
  
  nginx-test-noauth:
    profiles:
      - test-noauth
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      # 커스텀 설정 파일을 nginx 컨테이너 내부의 설정 파일로 마운트
      - ./nginx/nginx-test-noauth/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring1
    networks:
      - app-network

  spring-test:
    profiles:
      - test
    image: hf/backend:latest
    container_name: spring-test-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local-dev,secret,constants,priv
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_ALARM_QUEUE_URL=${AWS_SQS_ALARM_QUEUE_URL}
      - AWS_SQS_DB_QUEUE_URL=${AWS_SQS_DB_QUEUE_URL}
      - REDIS_HOST=redis://redis-container:6379
    networks:
      - app-network
      - hf-net
    depends_on:
      redis:
        condition: service_started
      # mysql:
      #   condition: service_healthy

  spring-blue:
    profiles:
      - blue
    image: hf/backend:latest
    container_name: spring-blue-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod,secret,constants
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_ALARM_QUEUE_URL=${AWS_SQS_ALARM_QUEUE_URL}
      - AWS_SQS_DB_QUEUE_URL=${AWS_SQS_DB_QUEUE_URL}
      - REDIS_HOST=redis://redis-container:6379
      - CURRENT_MODE=BLUE
    networks:
      - app-network
      - hf-net
    depends_on:
      redis:
        condition: service_started

  spring-green:
    profiles:
      - green
    image: hf/backend:latest
    container_name: spring-green-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod,secret,constants
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_ALARM_QUEUE_URL=${AWS_SQS_ALARM_QUEUE_URL}
      - AWS_SQS_DB_QUEUE_URL=${AWS_SQS_DB_QUEUE_URL}
      - REDIS_HOST=redis://redis-container:6379
      - CURRENT_MODE=GREEN
    networks:
      - app-network
      - hf-net
    depends_on:
      redis:
        condition: service_started

  spring-test-noauth:
    profiles:
      - test-noauth
    image: hf/backend:latest
    container_name: spring1-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local-dev,secret,constants,priv,no-auth
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SQS_ALARM_QUEUE_URL=${AWS_SQS_ALARM_QUEUE_URL}
      - AWS_SQS_DB_QUEUE_URL=${AWS_SQS_DB_QUEUE_URL}
      - REDIS_HOST=redis://redis-container:6379
    networks:
      - app-network
      - hf-net
    depends_on:
      redis:
        condition: service_started
      # mysql:
      #   condition: service_healthy

  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - app-network

  # mysql:
  #   image: mysql:8.0.40
