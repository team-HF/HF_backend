server {
    listen 80;
    server_name api.healthfriend.site;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.healthfriend.site;

    ssl_certificate /etc/letsencrypt/live/api.healthfriend.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.healthfriend.site/privkey.pem;

    location / {
        proxy_pass http://spring-container:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}